; School ERP — PHP Settings for cPanel / shared hosting

upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
max_input_vars = 3000

; Sessions
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1800

; Error handling (disable on production)
display_errors = Off
log_errors = On

; Timezone
date.timezone = Asia/Kolkata

; File uploads
file_uploads = On
